<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadr admin</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 48px 16px; background: #fafafa; color: #222; }
    main { max-width: 560px; margin: 0 auto; }
    code { background: #eee; padding: 1px 5px; border-radius: 4px; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #ddd; } code { background: #2a2a2a; } }
  </style>
</head>
<body>
  <main>
    <h1>Kadr</h1>
    <p>This binary was built without the admin UI. The Admin API is available under <code>/admin/api</code>.</p>
    <p>To embed the UI, run <code>make web</code> (or <code>make build</code>) and rebuild the binary.</p>
  </main>
</body>
</html>
